{% extends 'base.html' %}
{% block title %}菜品列表{% endblock %}
{% block content %}
<h2 class="mb-3">菜品列表</h2>
<div class="row g-3">
    {% for p in products %}
        <div class="col-md-4">
            <div class="card h-100 shadow-sm">
                <img src="{{ p.image_url or 'https://picsum.photos/400/220?random=' ~ p.id }}" class="card-img-top product-img" alt="{{ p.name }}">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title">{{ p.name }}</h5>
                    <p class="card-text text-muted">￥{{ '%.2f'|format(p.price) }}</p>
                    <a href="{{ url_for('main.product_detail', product_id=p.id) }}" class="btn btn-outline-primary mt-auto">查看详情</a>
                </div>
            </div>
        </div>
    {% else %}
        <p>暂无菜品，请管理员添加。</p>
    {% endfor %}
</div>
{% endblock %}
