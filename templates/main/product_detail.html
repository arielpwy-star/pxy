{% extends 'base.html' %}
{% block title %}菜品详情{% endblock %}
{% block content %}
<div class="row">
    <div class="col-md-5">
        <img src="{{ product.image_url or 'https://picsum.photos/600/360?random=' ~ product.id }}" class="img-fluid rounded" alt="{{ product.name }}">
    </div>
    <div class="col-md-7">
        <h2>{{ product.name }}</h2>
        <p>{{ product.description }}</p>
        <h4 class="text-danger">￥{{ '%.2f'|format(product.price) }}</h4>
        {% if session.get('user_id') %}
        <form method="post" action="{{ url_for('main.add_to_cart', product_id=product.id) }}" class="d-flex gap-2 mt-3">
            <input class="form-control" style="max-width:120px" type="number" name="quantity" min="1" value="1">
            <button class="btn btn-success" type="submit">加入购物车</button>
        </form>
        {% else %}
            <a href="{{ url_for('auth.login') }}" class="btn btn-primary mt-3">登录后购买</a>
        {% endif %}
    </div>
</div>
{% endblock %}
